name: Live-Alarmstatus

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Alarmstatus abrufen
        run: python3 tools/live.py /tmp/live.json
      - name: Auf Branch "live" ablegen (ein einziger Commit, ohne Verlauf)
        run: |
          cd "$(mktemp -d)"
          git init -q -b live
          cp /tmp/live.json .
          git add live.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Live-Status"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
      - name: Wächter - Dauerlauf neu starten, falls er nicht läuft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/${{ github.repository }}/actions/workflows/live-loop.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          if [ "$active" = "0" ]; then
            echo "Dauerlauf läuft nicht, starte ihn neu"
            gh workflow run live-loop.yml -R "${{ github.repository }}" --ref main -f minutes=330
          else
            echo "Dauerlauf läuft ($active)"
          fi
